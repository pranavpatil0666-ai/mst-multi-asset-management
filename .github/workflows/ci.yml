name: MST Multi-Asset Hub CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. SMART CONTRACTS TEST & COMPILATION
  # ==========================================
  smart-contracts-ci:
    name: Smart Contracts (Hardhat & Solidity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Contract Dependencies
        run: npm ci

      - name: Compile Smart Contracts (Solidity 0.8.24 Cancun)
        run: npx hardhat compile

      - name: Run Automated Test Suite (14 Unit Tests)
        env:
          CI: true
        run: npx hardhat test

  # ==========================================
  # 2. FRONTEND BUILD & TYPE VALIDATION
  # ==========================================
  frontend-ci:
    name: Frontend Application (Next.js 15)
    runs-on: ubuntu-latest
    needs: smart-contracts-ci
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Optimized Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_AUTHORITY_REGISTRY: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
          NEXT_PUBLIC_DEGREE_CONTRACT: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
          NEXT_PUBLIC_CARBON_BATCH: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
          NEXT_PUBLIC_CARBON_RECEIPT: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
          NEXT_PUBLIC_LAND_TITLE: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
          NEXT_PUBLIC_ASSET_MANAGER: "0x0165878A594ca255338adfa4d48449f69242Eb8F"
          NEXT_PUBLIC_MARKETPLACE: "0xa513E6E4b8f2a923D98304ec87F64353C4D5C853"
        run: npm run build

  # ==========================================
  # 3. SECURITY & DEPENDENCY AUDIT
  # ==========================================
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Root NPM Audit
        run: npm audit --omit=dev --audit-level=critical || true

      - name: Run Frontend NPM Audit
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=critical || true
